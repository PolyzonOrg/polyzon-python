[build-system]
requires = ["hatchling>=1.32,<1.33"]
build-backend = "hatchling.build"

[project]
name = "polyzon"
dynamic = ["version"]
description = "Official Python SDK for the Polyzon API: search 3D models across Thingiverse, Printables, MakerWorld and more"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Polyzon" }]
keywords = ["polyzon", "3d-models", "3d-printing", "stl", "search", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
socks = ["httpx[socks]>=0.27,<1"]
dev = [
    "build==1.6.1",
    "coverage[toml]==7.16.2",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "twine==7.0.0",
]

[project.urls]
Homepage = "https://api.polyzon.org"
Documentation = "https://api.polyzon.org"
Source = "https://github.com/PolyzonOrg/polyzon-python"
Issues = "https://github.com/PolyzonOrg/polyzon-python/issues"
Changelog = "https://github.com/PolyzonOrg/polyzon-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/polyzon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/polyzon"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/README.ru.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "S", "C4", "SIM", "RUF", "PT", "PIE",
    "RET", "ASYNC", "T20", "PERF",
]
ignore = [
    "D105", # magic methods document themselves
    "D107", # __init__ is documented on the class
    "RUF001", "RUF002", "RUF003", # Cyrillic text is intentional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "PT011"]
"examples/**" = ["D", "T20", "S"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=polyzon", "--cov-report=term-missing", "--cov-fail-under=90"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["polyzon"]

[tool.coverage.report]
show_missing = true
skip_covered = false
